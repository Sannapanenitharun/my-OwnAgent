<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fleet — observability agent</title>
  <style>
    :root {
      --bg: #0b0f14; --panel: #121820; --line: #243041; --text: #e8edf2;
      --muted: #8b98a5; --accent: #2dd4bf; --accent-soft: rgba(45,212,191,.12);
      --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --sidebar: #0e141b;
      --bar: #1e2936; --grid: #1a2430;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.45 "Segoe UI", ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 1180px; margin: 0 auto; padding: 20px 20px 60px; }
    header.top { display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 19px; font-weight: 650; }
    .sub { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .pill { font-size: 10px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
      color: var(--muted); display: inline-block; }
    .ok { color: var(--ok); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.1); }
    .warn { color: var(--warn); border-color: rgba(251,191,36,.35); background: rgba(251,191,36,.08); }
    .bad { color: var(--bad); border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.1); }
    .blue { color: #60a5fa; border-color: rgba(96,165,250,.4); background: rgba(96,165,250,.1); }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 14px 16px; cursor: pointer; text-align: left; color: inherit; font: inherit; width: 100%; }
    .card:hover { border-color: var(--accent); }
    .card.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .card h2 { margin: 0 0 2px; font-size: 15px; font-weight: 650;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .meta { color: var(--muted); font-size: 11px; margin-bottom: 12px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .usage { margin-bottom: 9px; }
    .usage .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase;
      letter-spacing: .04em; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .bar { height: 8px; background: var(--bar); border-radius: 999px; overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #22c55e, #4ade80); transition: width .4s ease; }
    .bar.mem > i { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .bar.disk > i { background: linear-gradient(90deg, #a78bfa, #c4b5fd); }
    .bar.hot > i { background: linear-gradient(90deg, #f59e0b, #f87171); }
    .foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 11px; }

    section.detail { margin-top: 22px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 14px 16px; margin-bottom: 12px; }
    .panel h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
    .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px 18px; }
    .kv div { font-size: 12px; min-width: 0; }
    .kv .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .kv .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .tab { border: 1px solid var(--line); background: transparent; color: var(--muted);
      padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 12px; }
    .tab.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
    .scroll { max-height: 420px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--grid); }
    th { color: var(--muted); font-size: 10px; text-transform: uppercase;
      letter-spacing: .04em; font-weight: 600; position: sticky; top: 0; background: var(--panel); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 14px; }
    td.msg { font-family: ui-monospace, Consolas, monospace; font-size: 11px;
      color: var(--muted); word-break: break-word; }
    .filter { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text);
      border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 12px; margin-bottom: 10px; }
    .empty { color: var(--muted); font-size: 12px; padding: 18px 0; }
    .attrs { color: var(--muted); font-size: 10px; }
    .spark { width: 90px; height: 22px; vertical-align: middle; }
  </style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Fleet</h1>
      <p class="sub" id="sub">connecting…</p>
    </div>
    <div id="badges"></div>
  </header>

  <div class="cards" id="cards"></div>
  <p class="empty" id="noHosts" hidden>
    No agent has reported yet. An agent appears here once it POSTs to this intake —
    set <code>OBSAGENT_EXPORT_ENDPOINT</code> to this intake's ingest address and restart it.
  </p>

  <section class="detail" id="detail" hidden>
    <div class="panel">
      <h3 id="detailName"></h3>
      <div class="kv" id="detailKV"></div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="metrics">Metrics</button>
      <button class="tab" data-tab="logs">Logs</button>
      <button class="tab" data-tab="traces">Traces</button>
      <button class="tab" data-tab="resource">Resource</button>
    </div>
    <div class="panel">
      <input class="filter" id="filter" placeholder="Filter…" />
      <div class="scroll" id="tabBody"></div>
    </div>
  </section>
</main>

<script>
"use strict";
var selected = null, tab = "metrics", detail = null, filterText = "";

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function bytes(n) {
  if (!n) return "0 B";
  var u = ["B", "KB", "MB", "GB", "TB", "PB"], i = 0, v = Number(n);
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(v >= 10 || i === 0 ? 0 : 1) + " " + u[i];
}
function dur(s) {
  s = Math.max(0, Math.floor(Number(s) || 0));
  var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return d + "d " + h + "h";
  if (h) return h + "h " + m + "m";
  if (m) return m + "m";
  return s + "s";
}
function num(v) {
  var n = Number(v);
  if (!isFinite(n)) return String(v);
  if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2) + "G";
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (Math.abs(n) >= 1000) return n.toFixed(0);
  if (Number.isInteger(n)) return String(n);
  return n.toFixed(3);
}
function bar(cls, pct) {
  var p = Math.max(0, Math.min(100, Number(pct) || 0));
  return '<div class="bar ' + cls + (p >= 85 ? " hot" : "") + '"><i style="width:' + p.toFixed(1) + '%"></i></div>';
}
function usage(label, pct, right, cls) {
  return '<div class="usage"><div class="lbl"><span>' + label + "</span><span>" +
    right + "</span></div>" + bar(cls, pct) + "</div>";
}

function sparkline(history) {
  if (!history || history.length < 2) return "";
  var vals = history.map(function (p) { return Number(p.v) || 0; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var span = max - min || 1, w = 90, h = 22, step = w / (vals.length - 1);
  var d = vals.map(function (v, i) {
    return (i ? "L" : "M") + (i * step).toFixed(1) + "," + (h - 2 - ((v - min) / span) * (h - 4)).toFixed(1);
  }).join(" ");
  return '<svg class="spark" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
    '<path d="' + d + '" fill="none" stroke="#2dd4bf" stroke-width="1.5"/></svg>';
}

function renderFleet(f) {
  var live = f.live, total = f.total;
  document.getElementById("sub").textContent =
    total + (total === 1 ? " host" : " hosts") + " reporting · " + live + " live · updated " +
    new Date(f.now).toLocaleTimeString();
  document.getElementById("badges").innerHTML =
    '<span class="pill ' + (live === total && total > 0 ? "ok" : total === 0 ? "" : "warn") + '">' +
    live + "/" + total + " live</span>";

  document.getElementById("noHosts").hidden = total > 0;

  var cards = f.hosts.map(function (h) {
    var os = [h.platform || h.os, h.architecture].filter(Boolean).join(" · ");
    var state = h.stale
      ? '<span class="pill bad">stale ' + dur(h.age_seconds) + "</span>"
      : '<span class="pill ok">live</span>';
    var cloud = h.cloud_provider ? '<span class="pill blue">' + esc(h.cloud_provider) + "</span>" : "";
    var agent = h.agent_version ? '<span class="pill">v' + esc(h.agent_version) + "</span>" : "";
    var drop = h.dropped_series ? '<span class="pill warn">' + h.dropped_series + " dropped</span>" : "";
    return '<button class="card' + (selected === h.host ? " sel" : "") + '" data-host="' + esc(h.host) + '">' +
      "<h2>" + esc(h.host) + "</h2>" +
      '<div class="meta">' + esc(h.host_id && h.host_id !== h.host ? h.host_id + " · " : "") +
        esc(os || "unknown platform") + (h.uptime_seconds ? " · up " + dur(h.uptime_seconds) : "") + "</div>" +
      usage("CPU", h.cpu_percent, (Number(h.cpu_percent) || 0).toFixed(1) + "%", "cpu") +
      usage("Memory", h.mem_percent,
        (h.mem_total_bytes ? bytes(h.mem_used_bytes) + " / " + bytes(h.mem_total_bytes)
                           : (Number(h.mem_percent) || 0).toFixed(1) + "%"), "mem") +
      usage("Disk (fullest)", h.disk_percent, (Number(h.disk_percent) || 0).toFixed(1) + "%", "disk") +
      '<div class="foot">' + state + cloud + agent + drop +
        '<span class="pill">' + h.series + " series</span>" +
        (h.processes ? '<span class="pill">' + num(h.processes) + " procs</span>" : "") +
      "</div></button>";
  }).join("");
  document.getElementById("cards").innerHTML = cards;

  Array.prototype.forEach.call(document.querySelectorAll(".card"), function (el) {
    el.addEventListener("click", function () { select(el.getAttribute("data-host")); });
  });
}

function select(host) {
  selected = selected === host ? null : host;
  if (!selected) {
    document.getElementById("detail").hidden = true;
    detail = null;
    poll();
    return;
  }
  loadDetail();
}

function loadDetail() {
  if (!selected) return Promise.resolve();
  return fetch("/api/host?host=" + encodeURIComponent(selected))
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      detail = d;
      renderDetail();
    })
    .catch(function () {});
}

function renderDetail() {
  var box = document.getElementById("detail");
  if (!detail) { box.hidden = true; return; }
  box.hidden = false;
  document.getElementById("detailName").textContent = detail.host;

  var kv = [
    ["host id", detail.host_id || "—"],
    ["platform", [detail.platform || detail.os, detail.platform_version].filter(Boolean).join(" ") || "—"],
    ["architecture", detail.architecture || "—"],
    ["cloud", detail.cloud_provider || "—"],
    ["agent", detail.agent_version ? "v" + detail.agent_version : "—"],
    ["uptime", detail.uptime_seconds ? dur(detail.uptime_seconds) : "—"],
    ["last seen", dur(detail.age_seconds) + " ago"],
    ["first seen", new Date(detail.first_seen).toLocaleString()],
    ["series", detail.series + (detail.dropped_series ? " (" + detail.dropped_series + " dropped)" : "")],
    ["batches", "m " + detail.batches_metrics + " · l " + detail.batches_logs + " · t " + detail.batches_traces]
  ];
  document.getElementById("detailKV").innerHTML = kv.map(function (p) {
    return '<div><div class="k">' + esc(p[0]) + '</div><div class="v">' + esc(p[1]) + "</div></div>";
  }).join("");

  renderTab();
}

function renderTab() {
  var body = document.getElementById("tabBody");
  var f = document.getElementById("filter");
  if (!detail) { body.innerHTML = ""; return; }
  var q = filterText.toLowerCase();

  if (tab === "metrics") {
    f.placeholder = "Filter metrics by name or attribute…";
    var rows = detail.metrics.filter(function (m) {
      if (!q) return true;
      return (m.name + " " + JSON.stringify(m.attrs || {})).toLowerCase().indexOf(q) >= 0;
    });
    if (!rows.length) { body.innerHTML = '<p class="empty">No metrics match.</p>'; return; }
    body.innerHTML = "<table><thead><tr><th>Metric</th><th></th><th style='text-align:right'>Value</th></tr></thead><tbody>" +
      rows.map(function (m) {
        var a = m.attrs ? Object.keys(m.attrs).sort().map(function (k) {
          return k + "=" + m.attrs[k];
        }).join(" ") : "";
        return "<tr><td>" + esc(m.name) + (a ? '<div class="attrs">' + esc(a) + "</div>" : "") +
          "</td><td>" + sparkline(m.history) + '</td><td class="num">' + esc(num(m.value)) + "</td></tr>";
      }).join("") + "</tbody></table>";
    return;
  }

  if (tab === "logs") {
    f.placeholder = "Filter logs…";
    var logs = detail.logs.filter(function (l) {
      return !q || (l.message + " " + (l.source || "")).toLowerCase().indexOf(q) >= 0;
    });
    if (!logs.length) {
      body.innerHTML = '<p class="empty">No log lines received from this host yet. ' +
        "The agent ships logs only if its <code>logs</code> module is enabled and has readable sources.</p>";
      return;
    }
    body.innerHTML = "<table><thead><tr><th>Time</th><th>Status</th><th>Source</th><th>Message</th></tr></thead><tbody>" +
      logs.map(function (l) {
        return "<tr><td>" + esc(new Date(l.time).toLocaleTimeString()) + "</td><td>" +
          esc(l.status || "—") + "</td><td>" + esc(l.source || "—") +
          '</td><td class="msg">' + esc(l.message) + "</td></tr>";
      }).join("") + "</tbody></table>";
    return;
  }

  if (tab === "traces") {
    f.placeholder = "Filter spans…";
    var spans = detail.spans.filter(function (s) {
      return !q || (s.name + " " + s.trace_id).toLowerCase().indexOf(q) >= 0;
    });
    if (!spans.length) {
      body.innerHTML = '<p class="empty">No spans received. Traces appear only when an ' +
        "instrumented application sends OTLP to the agent's receiver — the agent does not generate them itself.</p>";
      return;
    }
    body.innerHTML = "<table><thead><tr><th>Time</th><th>Span</th><th>Trace</th><th>Status</th></tr></thead><tbody>" +
      spans.map(function (s) {
        return "<tr><td>" + esc(new Date(s.time).toLocaleTimeString()) + "</td><td>" + esc(s.name) +
          '</td><td class="msg">' + esc(s.trace_id) + "</td><td>" + esc(s.status || "—") + "</td></tr>";
      }).join("") + "</tbody></table>";
    return;
  }

  f.placeholder = "Filter resource attributes…";
  var res = detail.resource || {};
  var keys = Object.keys(res).sort().filter(function (k) {
    return !q || (k + " " + res[k]).toLowerCase().indexOf(q) >= 0;
  });
  if (!keys.length) { body.innerHTML = '<p class="empty">No resource attributes.</p>'; return; }
  body.innerHTML = "<table><thead><tr><th>Attribute</th><th>Value</th></tr></thead><tbody>" +
    keys.map(function (k) {
      return "<tr><td>" + esc(k) + "</td><td>" + esc(res[k]) + "</td></tr>";
    }).join("") + "</tbody></table>";
}

Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (btn) {
  btn.addEventListener("click", function () {
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.classList.toggle("active", b === btn);
    });
    tab = btn.getAttribute("data-tab");
    renderTab();
  });
});
document.getElementById("filter").addEventListener("input", function (e) {
  filterText = e.target.value;
  renderTab();
});

function poll() {
  return fetch("/api/fleet")
    .then(function (r) { return r.json(); })
    .then(function (f) {
      renderFleet(f);
      if (selected && f.hosts.every(function (h) { return h.host !== selected; })) {
        selected = null;
        detail = null;
        document.getElementById("detail").hidden = true;
      }
      return selected ? loadDetail() : null;
    })
    .catch(function () {
      document.getElementById("sub").textContent = "intake unreachable — retrying";
    });
}

poll();
setInterval(poll, 5000);
</script>
</body>
</html>
